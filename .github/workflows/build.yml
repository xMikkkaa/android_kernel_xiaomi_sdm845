name: Build Kernel

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}
        submodules: recursive
        fetch-depth: 0

    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev zip unzip curl git python3 python3-requests \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi gcc-arm-none-eabi
          
    - name: Cache Neutron Clang
      id: cache-neutron
      uses: actions/cache@v6
      with:
        path: neutron-clang
        key: neutron-clang-cache

    - name: Setup Neutron Clang
      run: |
        mkdir -p neutron-clang
        cd neutron-clang
        if [ ! -f "antman" ]; then
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
        fi
        ./antman -S

    - name: Add Neutron Clang to PATH
      run: |
        echo "$(pwd)/neutron-clang/bin" >> $GITHUB_PATH
        
    - name: Verify Compiler Version
      run: |
        echo "=== Compiler Versions ==="
        clang --version
        ld.lld --version

    - name: Clone AnyKernel3
      run: |
        # Clone AnyKernel3 repository
        mkdir -p tools
        cd tools
        git clone https://github.com/xMikkkaa/AnyKernel3.git AnyKernel3

    - name: Apply SELinux Hide Patch to KernelSU
      run: |
        if [ -f "scripts/ksu_selinux_hide.patch" ]; then
          cd KernelSU
          patch -p1 < ../scripts/ksu_selinux_hide.patch
        fi

    - name: Build Kernel Release
      run: |
        START_TIME=$(date +%s)
        chmod +x compile.sh
        ./compile.sh --release
        END_TIME=$(date +%s)
        DIFF=$((END_TIME - START_TIME))
        echo "DURATION=$((DIFF / 60))m $((DIFF % 60))s" >> $GITHUB_ENV
        
        # Read ReSukiSU version directly from build log
        KSU_VERSION=$(grep -m1 "ReSukiSU version code:" out/build.log | grep -o '[0-9]*$')
        echo "KSU_VERSION=${KSU_VERSION}" >> $GITHUB_ENV

        # Read kernel names from the ZIPs generated by compile.sh
        KERNEL_NAMES=$(for zip in out/zip/*.zip; do
          [ -e "$zip" ] || continue
          basename "$zip" .zip
        done | sort -u | paste -sd ', ' -)
        echo "KERNEL_NAMES=${KERNEL_NAMES}" >> $GITHUB_ENV
        
        # Rename output zips to include ReSukiSU version
        for zip in out/zip/*.zip; do
            [ -e "$zip" ] || continue
            BASENAME=$(basename "$zip" .zip)
            mv "$zip" "out/zip/${BASENAME}-${KSU_VERSION}.zip"
        done


    - name: Wait for older builds to finish
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Checking for older running jobs to ensure chronological releases..."
        while true; do
          OLDER_RUNS=$(gh run list --repo ${{ github.repository }} --workflow build.yml --branch ${{ github.ref_name }} --json databaseId,status --jq "[.[] | select(.databaseId < ${{ github.run_id }} and (.status == \"in_progress\" or .status == \"queued\" or .status == \"pending\" or .status == \"requested\" or .status == \"waiting\"))] | length")
          if [ -z "$OLDER_RUNS" ] || [ "$OLDER_RUNS" -eq 0 ]; then
            echo "No older runs pending. Proceeding!"
            break
          fi
          echo "Waiting for $OLDER_RUNS older run(s) to finish..."
          sleep 60
        done

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Chimera-Kernel-ZIPs
        path: out/zip/*.zip

    - name: Telegram Notification & Commit Log
      env:
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        TG_DUMP_CHAT_ID: ${{ secrets.TG_DUMP_CHAT_ID }}
        TG_DUMP_THREAD_ID: ${{ secrets.TG_DUMP_THREAD_ID }}
      run: |
        BRANCH=${GITHUB_REF_NAME}
        COMMIT=$(git rev-parse --short HEAD)
        
        # Determine commit message source (KernelSU or Chimera)
        if git diff-tree --no-commit-id --name-only -r HEAD | grep -q "KernelSU"; then
            # KernelSU was updated
            RAW_MSG=$(cd KernelSU && git log -1 --pretty=format:"%B")
            COMMIT_MSG="[ReSukiSU Update] ${RAW_MSG}"
        else
            # Chimera was updated
            COMMIT_MSG="$(git log -1 --pretty=format:"%B")"
        fi

        # Keep the full message unless it exceeds Telegram's safe message budget.
        if [ "${#COMMIT_MSG}" -gt 3192 ]; then
            COMMIT_MSG="${COMMIT_MSG:0:3189}..."
        fi
        
        # Escape HTML characters in COMMIT_MSG for Telegram
        COMMIT_MSG=$(printf '%s' "$COMMIT_MSG" | sed 's/&/&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
        
        # Prepare HTML formatted caption
        CAPTION="<b>${KERNEL_NAMES}</b>
        ReSukiSU Version: ${KSU_VERSION}
        Branch: ${BRANCH}
        <a href=\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\">#ci_${COMMIT}</a>
        Duration: ${{ env.DURATION }}
        
        <pre><code class=\"language-copy\">${COMMIT_MSG}</code></pre>"
        
        export CAPTION
        
        # Python script to send Media Group using file_id caching (bypasses 50MB limit)
        python3 - <<'PY'
        import glob
        import json
        import os
        import sys
        import time

        import requests

        bot_token = os.environ.get("TG_TOKEN")
        chat_id = os.environ.get("TG_CHAT_ID")
        dump_chat_id = os.environ.get("TG_DUMP_CHAT_ID")
        dump_thread_id = os.environ.get("TG_DUMP_THREAD_ID")
        commit_text = os.environ.get("CAPTION", "")

        def api_post(method, payload, files=None, retries=3):
            last_error = None
            for attempt in range(retries):
                try:
                    r = requests.post(
                        f"https://api.telegram.org/bot{bot_token}/{method}",
                        data=payload,
                        files=files,
                        timeout=(20, 120),
                    )
                    body = r.json()
                    if body.get("ok"):
                        return body["result"]
                    last_error = body
                    print(f"[{method}] attempt {attempt + 1}/{retries}: {body}")
                    if body.get("error_code") in (400, 403, 404):
                        raise SystemExit(f"Telegram API rejected {method}: {body}")
                    time.sleep(2 ** attempt)
                except Exception as exc:  # pragma: no cover - best-effort fallback
                    last_error = exc
                    print(f"[{method}] transport error: {exc}")
                    time.sleep(2 ** attempt)
            raise SystemExit(f"{method} failed after {retries} attempts: {last_error}")

        files = sorted(glob.glob("out/zip/*.zip"))
        if not files:
            print("No zip files found to send!")
            sys.exit(0)

        file_ids = []
        for i, path in enumerate(files, 1):
            print(f"Uploading {path} to Dump Chat ({i}/{len(files)})...")
            payload = {"chat_id": dump_chat_id, "disable_notification": True}
            if dump_thread_id:
                payload["message_thread_id"] = dump_thread_id
            try:
                with open(path, "rb") as fh:
                    result = api_post("sendDocument", payload, files={"document": fh})
                file_ids.append(result["document"]["file_id"])
            except SystemExit:
                raise
            except Exception as exc:
                print(f"Failed to upload {path}: {exc}")

        if not file_ids:
            print("Failed to upload any files to dump chat.")
            sys.exit(1)

        chunks = [file_ids[i:i + 10] for i in range(0, len(file_ids), 10)]
        first_message_id = None

        for idx, chunk in enumerate(chunks, 1):
            if not chunk:
                continue
            media = [{"type": "document", "media": fid} for fid in chunk]
            payload = {"chat_id": chat_id, "media": json.dumps(media)}
            print(f"Sending MediaGroup {idx}/{len(chunks)} to Main Chat...")
            result = api_post("sendMediaGroup", payload)
            if result and isinstance(result, list):
                first_message_id = first_message_id or result[0].get("message_id")
            time.sleep(2)

        if commit_text.strip():
            data = {
                "chat_id": chat_id,
                "text": commit_text,
                "parse_mode": "HTML",
                "link_preview_options": json.dumps({"is_disabled": True}),
            }
            if first_message_id:
                data["reply_parameters"] = json.dumps(
                    {"message_id": first_message_id, "allow_sending_without_reply": True}
                )
            print("Sending commit message to Main Chat...")
            api_post("sendMessage", data)
        PY

    - name: Notify Telegram on Failure
      if: failure()
      env:
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_DUMP_CHAT_ID: ${{ secrets.TG_DUMP_CHAT_ID }}
        TG_DUMP_THREAD_ID: ${{ secrets.TG_DUMP_THREAD_ID }}
      run: |
        COMMIT=$(git rev-parse --short HEAD)
        MSG="⚠️ <b>Build Failed</b> · Chimera-CI%0A"
        MSG+="<code>${GITHUB_REF_NAME}</code> · <code>${COMMIT}</code>%0A"
        MSG+="<a href=\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\">#${GITHUB_RUN_NUMBER} · View logs</a>"
        curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
          -d "chat_id=${TG_DUMP_CHAT_ID}" \
          -d "message_thread_id=${TG_DUMP_THREAD_ID}" \
          -d "parse_mode=HTML" \
          -d "text=${MSG}"
