name: Build Kernel

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  checkout-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}
        submodules: recursive
        fetch-depth: 0

    - name: Clone AnyKernel3
      run: |
        mkdir -p tools
        cd tools
        git clone https://github.com/xMikkkaa/AnyKernel3.git AnyKernel3

    - name: Apply SELinux Hide Patch to KernelSU
      run: |
        if [ -f "scripts/ksu_selinux_hide.patch" ]; then
          cd KernelSU
          if patch -p1 --dry-run < ../scripts/ksu_selinux_hide.patch; then
            patch -p1 < ../scripts/ksu_selinux_hide.patch
          else
            echo "Plain patch missed, retrying 3-way against submodule history..."
            git apply --3way --whitespace=fix ../scripts/ksu_selinux_hide.patch
          fi
        fi

    - name: Validate Source Prep
      run: |
        test -d KernelSU || { echo "KernelSU missing!"; exit 1; }
        test -f tools/AnyKernel3/anykernel.sh || { echo "AnyKernel3 broken!"; exit 1; }
        echo "## checkout-source: OK" >> $GITHUB_STEP_SUMMARY
        echo "Checkout + AnyKernel3 + SELinux patch valid." >> $GITHUB_STEP_SUMMARY

  setup-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev zip unzip curl git python3 python3-requests \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi gcc-arm-none-eabi

    - name: Validate Environment
      run: |
        echo "## setup-environment: OK" >> $GITHUB_STEP_SUMMARY
        echo "apt deps installed, package list valid." >> $GITHUB_STEP_SUMMARY

  setup-clang:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Cache Neutron Clang
      id: cache-neutron
      uses: actions/cache@v6
      with:
        path: neutron-clang
        key: neutron-clang-cache

    - name: Setup Neutron Clang
      run: |
        mkdir -p neutron-clang
        cd neutron-clang
        if [ ! -f "antman" ]; then
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
        fi
        ./antman -S

    - name: Add Neutron Clang to PATH
      run: |
        echo "$(pwd)/neutron-clang/bin" >> $GITHUB_PATH

    - name: Verify Compiler Version
      run: |
        echo "=== Compiler Versions ==="
        clang --version
        ld.lld --version
        {
          echo "## setup-clang: OK"
          echo ""
          echo "- Cache hit: \`${{ steps.cache-neutron.outputs.cache-hit }}\`"
          echo ""
          echo '```'
          clang --version | head -2
          echo '```'
          echo "This cache is reused by the \`build\` job (warming)."
        } >> $GITHUB_STEP_SUMMARY

  build:
    runs-on: ubuntu-latest
    needs: [checkout-source, setup-environment, setup-clang]
    timeout-minutes: 90
    outputs:
      kernel-name: ${{ steps.vars.outputs.kernel-name }}
      ksu-version: ${{ steps.vars.outputs.ksu-version }}
      duration: ${{ steps.vars.outputs.duration }}
      
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}
        submodules: recursive
        fetch-depth: 0

    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev zip unzip curl git python3 python3-requests \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi gcc-arm-none-eabi
          
    - name: Cache Neutron Clang
      id: cache-neutron
      uses: actions/cache@v6
      with:
        path: neutron-clang
        key: neutron-clang-cache

    - name: Setup Neutron Clang
      run: |
        mkdir -p neutron-clang
        cd neutron-clang
        if [ ! -f "antman" ]; then
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
        fi
        ./antman -S

    - name: Add Neutron Clang to PATH
      run: |
        echo "$(pwd)/neutron-clang/bin" >> $GITHUB_PATH
        
    - name: Verify Compiler Version
      run: |
        echo "=== Compiler Versions ==="
        clang --version
        ld.lld --version

    - name: Clone AnyKernel3
      run: |
        # Clone AnyKernel3 repository
        mkdir -p tools
        cd tools
        git clone https://github.com/xMikkkaa/AnyKernel3.git AnyKernel3

    - name: Apply SELinux Hide Patch to KernelSU
      run: |
        if [ -f "scripts/ksu_selinux_hide.patch" ]; then
          cd KernelSU
          if patch -p1 --dry-run < ../scripts/ksu_selinux_hide.patch; then
            patch -p1 < ../scripts/ksu_selinux_hide.patch
          else
            echo "Plain patch missed, retrying 3-way against submodule history..."
            git apply --3way --whitespace=fix ../scripts/ksu_selinux_hide.patch
          fi
        fi

    - name: Build Kernel Release
      run: |
        START_TIME=$(date +%s)
        chmod +x compile.sh
        ./compile.sh --release
        END_TIME=$(date +%s)
        DIFF=$((END_TIME - START_TIME))
        echo "DURATION=$((DIFF / 60))m $((DIFF % 60))s" >> $GITHUB_ENV
        
        # Read ReSukiSU version directly from build log
        KSU_VERSION=$(grep -m1 "ReSukiSU version code:" out/build.log | grep -o '[0-9]*$')
        echo "KSU_VERSION=${KSU_VERSION}" >> $GITHUB_ENV

        # Read the base kernel name written by compile.sh
        KERNEL_NAME=$(cat out/kernel_name)
        echo "KERNEL_NAME=${KERNEL_NAME}" >> $GITHUB_ENV
        
        # Rename output zips to include ReSukiSU version
        for zip in out/zip/*.zip; do
            [ -e "$zip" ] || continue
            BASENAME=$(basename "$zip" .zip)
            mv "$zip" "out/zip/${BASENAME}-${KSU_VERSION}.zip"
        done

        # 12 files are self-describing (SE / NSE / Dynamic).
        for zip in out/zip/*.zip; do
            [ -e "$zip" ] || continue
            case "$zip" in
              *-NSE-*|*-Dynamic-*) continue ;;
            esac
            mv "$zip" "${zip/${KERNEL_NAME}-OC/${KERNEL_NAME}-SE-OC}"
        done

        # Hard validation: env must be set + exactly 12 zips (fail LOUD, not warn)
        [ -n "${KSU_VERSION}" ] || { echo "KSU_VERSION is empty, build is broken!"; exit 1; }
        [ -n "${KERNEL_NAME}" ] || { echo "KERNEL_NAME is empty, build is broken!"; exit 1; }
        COUNT=$(ls out/zip/*.zip 2>/dev/null | wc -l)
        echo "ZIP_COUNT=${COUNT}" >> $GITHUB_ENV
        if [ "${COUNT}" -ne 12 ]; then
          echo "Expected 12 zips, found ${COUNT}:"
          ls -lh out/zip/ || true
          exit 1
        fi
        echo "OK: 12/12 zips (${KERNEL_NAME}, KSU ${KSU_VERSION})"


    - name: Wait for older builds to finish
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Checking for older running jobs to ensure chronological releases..."
        TRIES=0
        while true; do
          TRIES=$((TRIES + 1))
          if [ "$TRIES" -gt 30 ]; then
            echo "Waited 30 minutes, older runs never finished. Failing loud instead of hanging."
            exit 1
          fi
          OLDER_RUNS=$(gh run list --repo ${{ github.repository }} --workflow build.yml --branch ${{ github.ref_name }} --json databaseId,status --jq "[.[] | select(.databaseId < ${{ github.run_id }} and (.status == \"in_progress\" or .status == \"queued\" or .status == \"pending\" or .status == \"requested\" or .status == \"waiting\"))] | length")
          if [ -z "$OLDER_RUNS" ] || [ "$OLDER_RUNS" -eq 0 ]; then
            echo "No older runs pending. Proceeding!"
            break
          fi
          echo "Waiting for $OLDER_RUNS older run(s) to finish..."
          sleep 60
        done

    - name: Upload Artifact - SE OC805
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.KERNEL_NAME }}-SE-OC805
        path: out/zip/${{ env.KERNEL_NAME }}-SE-OC805-*.zip
        if-no-files-found: error
        retention-days: 90
        compression-level: 0

    - name: Upload Artifact - SE OC820
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.KERNEL_NAME }}-SE-OC820
        path: out/zip/${{ env.KERNEL_NAME }}-SE-OC820-*.zip
        if-no-files-found: error
        retention-days: 90
        compression-level: 0

    - name: Upload Artifact - SE OC835
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.KERNEL_NAME }}-SE-OC835
        path: out/zip/${{ env.KERNEL_NAME }}-SE-OC835-*.zip
        if-no-files-found: error
        retention-days: 90
        compression-level: 0

    - name: Upload Artifact - SE OC844
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.KERNEL_NAME }}-SE-OC844
        path: out/zip/${{ env.KERNEL_NAME }}-SE-OC844-*.zip
        if-no-files-found: error
        retention-days: 90
        compression-level: 0

    - name: Upload Artifact - NSE OC805
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.KERNEL_NAME }}-NSE-OC805
        path: out/zip/${{ env.KERNEL_NAME }}-NSE-OC805-*.zip
        if-no-files-found: error
        retention-days: 90
        compression-level: 0

    - name: Upload Artifact - NSE OC820
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.KERNEL_NAME }}-NSE-OC820
        path: out/zip/${{ env.KERNEL_NAME }}-NSE-OC820-*.zip
        if-no-files-found: error
        retention-days: 90
        compression-level: 0

    - name: Upload Artifact - NSE OC835
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.KERNEL_NAME }}-NSE-OC835
        path: out/zip/${{ env.KERNEL_NAME }}-NSE-OC835-*.zip
        if-no-files-found: error
        retention-days: 90
        compression-level: 0

    - name: Upload Artifact - NSE OC844
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.KERNEL_NAME }}-NSE-OC844
        path: out/zip/${{ env.KERNEL_NAME }}-NSE-OC844-*.zip
        if-no-files-found: error
        retention-days: 90
        compression-level: 0

    - name: Upload Artifact - Dynamic OC805
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.KERNEL_NAME }}-Dynamic-OC805
        path: out/zip/${{ env.KERNEL_NAME }}-Dynamic-OC805-*.zip
        if-no-files-found: error
        retention-days: 90
        compression-level: 0

    - name: Upload Artifact - Dynamic OC820
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.KERNEL_NAME }}-Dynamic-OC820
        path: out/zip/${{ env.KERNEL_NAME }}-Dynamic-OC820-*.zip
        if-no-files-found: error
        retention-days: 90
        compression-level: 0

    - name: Upload Artifact - Dynamic OC835
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.KERNEL_NAME }}-Dynamic-OC835
        path: out/zip/${{ env.KERNEL_NAME }}-Dynamic-OC835-*.zip
        if-no-files-found: error
        retention-days: 90
        compression-level: 0

    - name: Upload Artifact - Dynamic OC844
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.KERNEL_NAME }}-Dynamic-OC844
        path: out/zip/${{ env.KERNEL_NAME }}-Dynamic-OC844-*.zip
        if-no-files-found: error
        retention-days: 90
        compression-level: 0

    - name: Build Summary
      run: |
        {
          echo "# Build done: ${KERNEL_NAME}"
          echo ""
          echo "- ReSukiSU: \`${KSU_VERSION}\` | Branch: \`${GITHUB_REF_NAME}\` | Duration: \`${{ env.DURATION }}\`"
          echo "- Commit: \`$(git rev-parse --short HEAD)\` | [Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          echo ""
          echo "## Toolchain"
          echo ""
          echo "| Component | Version |"
          echo "|---|---|"
          echo "| clang | \`$(clang --version | head -1)\` |"
          echo "| ld.lld | \`$(ld.lld --version | head -1)\` |"
          echo ""
          echo "## Variants (12 files, $(du -sh out/zip | cut -f1) total)"
          for FLAVOR in SE NSE Dynamic; do
            echo ""
            echo "### ${FLAVOR}"
            echo ""
            echo "| File | Size |"
            echo "|---|---|"
            for f in out/zip/*-${FLAVOR}-OC*.zip; do
              [ -e "$f" ] || continue
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done | sort
          done
          echo ""
          echo "> GitHub auto-deletes artifacts after 90 days"
          echo "> (public repo retention: 1-90 days, default 90)."
          echo "> Back up to Telegram / mirror before they expire!"
        } >> $GITHUB_STEP_SUMMARY
        ls -lh out/zip/

    - name: Export Release Vars
      id: vars
      run: |
        echo "kernel-name=${KERNEL_NAME}" >> $GITHUB_OUTPUT
        echo "ksu-version=${KSU_VERSION}" >> $GITHUB_OUTPUT
        echo "duration=${DURATION}" >> $GITHUB_OUTPUT

    - name: Notify Telegram on Failure
      if: failure()
      env:
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_DUMP_CHAT_ID: ${{ secrets.TG_DUMP_CHAT_ID }}
        TG_DUMP_THREAD_ID: ${{ secrets.TG_DUMP_THREAD_ID }}
      run: |
        COMMIT=$(git rev-parse --short HEAD)
        MSG="<b>Build Failed</b> · Chimera-CI%0A"
        MSG+="<code>${GITHUB_REF_NAME}</code> · <code>${COMMIT}</code>%0A"
        MSG+="<a href=\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\">#${GITHUB_RUN_NUMBER} · View logs</a>"
        curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
          -d "chat_id=${TG_DUMP_CHAT_ID}" \
          -d "message_thread_id=${TG_DUMP_THREAD_ID}" \
          -d "parse_mode=HTML" \
          -d "text=${MSG}"

  notify-telegram:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}
        submodules: recursive
        fetch-depth: 0

    - name: Download Kernel ZIPs
      uses: actions/download-artifact@v7
      with:
        pattern: ${{ needs.build.outputs.kernel-name }}-*
        path: out/zip
        merge-multiple: true

    - name: Telegram Notification & Commit Log
      continue-on-error: true
      env:
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        TG_DUMP_CHAT_ID: ${{ secrets.TG_DUMP_CHAT_ID }}
        TG_DUMP_THREAD_ID: ${{ secrets.TG_DUMP_THREAD_ID }}
        KERNEL_NAME: ${{ needs.build.outputs.kernel-name }}
        KSU_VERSION: ${{ needs.build.outputs.ksu-version }}
        DURATION: ${{ needs.build.outputs.duration }}
      run: |
        ls -lh out/zip/
        find out/zip -type f -size 0 -print || true
        BRANCH=${GITHUB_REF_NAME}
        COMMIT=$(git rev-parse --short HEAD)
        
        # Determine commit message source (KernelSU or Chimera)
        if git diff-tree --no-commit-id --name-only -r HEAD | grep -q "KernelSU"; then
            # KernelSU was updated
            RAW_MSG=$(cd KernelSU && git log -1 --pretty=format:"%B")
            AUTHOR_NAME=$(cd KernelSU && git log -1 --pretty=format:"%an")
            PREFIX="[ReSukiSU Update] "
        else
            # Chimera was updated
            RAW_MSG="$(git log -1 --pretty=format:"%B")"
            AUTHOR_NAME="$(git log -1 --pretty=format:"%an")"
            PREFIX=""
        fi
        SUFFIX=" by ${AUTHOR_NAME}"

        # Keep the full message unless it exceeds Telegram's safe message budget.
        BUDGET=$((3192 - ${#PREFIX} - ${#SUFFIX} - 3))
        if [ "${#RAW_MSG}" -gt "$BUDGET" ]; then
            RAW_MSG="${RAW_MSG:0:$BUDGET}..."
        fi
        COMMIT_MSG="${PREFIX}${RAW_MSG}${SUFFIX}"
        
        # Escape HTML characters in COMMIT_MSG for Telegram
        COMMIT_MSG=$(printf '%s' "$COMMIT_MSG" | sed 's/&/&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
        
        # Prepare HTML formatted caption
        CAPTION="<b>${KERNEL_NAME}</b>
        <a href=\"https://t.me/ReSukiSU\">ReSukiSU Version: ${KSU_VERSION}</a>
        Branch: ${BRANCH}
        Workflow: <a href=\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\">#ci_${COMMIT}</a>
        Duration: ${DURATION}
        
        <pre><code class=\"language-copy\">${COMMIT_MSG}</code></pre>"
        
        export CAPTION
        
        # Python script to send Media Group using file_id caching (bypasses 50MB limit)
        python3 - <<'PY'
        import glob
        import json
        import os
        import sys
        import time

        import requests

        bot_token = os.environ.get("TG_TOKEN")
        chat_id = os.environ.get("TG_CHAT_ID")
        dump_chat_id = os.environ.get("TG_DUMP_CHAT_ID")
        dump_thread_id = os.environ.get("TG_DUMP_THREAD_ID")
        commit_text = os.environ.get("CAPTION", "")

        def api_post(method, payload, files=None, retries=5):
            last_error = None
            for attempt in range(retries):
                try:
                    # Rewind file objects so retries never send an empty body
                    if files:
                        for v in files.values():
                            fobj = v[1] if isinstance(v, tuple) else v
                            try:
                                fobj.seek(0)
                            except Exception:
                                pass
                    r = requests.post(
                        f"https://api.telegram.org/bot{bot_token}/{method}",
                        data=payload,
                        files=files,
                        timeout=(20, 180),
                    )
                    body = r.json()
                    if body.get("ok"):
                        return body["result"]
                    last_error = body
                    print(f"[{method}] attempt {attempt + 1}/{retries}: {body}")
                    if body.get("error_code") == 429:
                        retry_after = body.get("parameters", {}).get("retry_after", 2 ** attempt)
                        print(f"[{method}] flood control, sleeping {retry_after}s...")
                        time.sleep(int(retry_after) + 1)
                        continue
                    if body.get("error_code") in (400, 403, 404):
                        raise SystemExit(f"Telegram API rejected {method}: {body}")
                    time.sleep(2 ** attempt + 2)
                except Exception as exc:  # pragma: no cover - best-effort fallback
                    last_error = exc
                    print(f"[{method}] transport error: {exc}")
                    time.sleep(2 ** attempt + 2)
            raise SystemExit(f"{method} failed after {retries} attempts: {last_error}")

        def send_document(path, payload, retries=5):
            # Open fresh file handle per attempt so a timed-out upload
            # never retries with an EOF pointer (which Telegram rejects
            # as 400 file must be non-empty).
            last_error = None
            for attempt in range(retries):
                try:
                    with open(path, "rb") as fh:
                        r = requests.post(
                            f"https://api.telegram.org/bot{bot_token}/sendDocument",
                            data=payload,
                            files={"document": (os.path.basename(path), fh)},
                            timeout=(20, 180),
                        )
                        body = r.json()
                        if body.get("ok"):
                            return body["result"]
                        last_error = body
                        print(f"[sendDocument] attempt {attempt + 1}/{retries}: {body}")
                        if body.get("error_code") == 429:
                            retry_after = body.get("parameters", {}).get("retry_after", 2 ** attempt)
                            print(f"[sendDocument] flood control, sleeping {retry_after}s...")
                            time.sleep(int(retry_after) + 1)
                            continue
                        if body.get("error_code") in (400, 403, 404):
                            # 400 file must be non-empty on a non-empty local file
                            # means a truncated/empty retry body, retry once with fresh handle
                            # except when Telegram insists the file itself is rejected.
                            if body.get("description") == "Bad Request: file must be non-empty":
                                print(f"[sendDocument] empty-body retry, reopening {path}...")
                                time.sleep(3)
                                continue
                            raise SystemExit(f"Telegram API rejected sendDocument: {body}")
                        time.sleep(2 ** attempt + 2)
                except Exception as exc:
                    last_error = exc
                    print(f"[sendDocument] transport error: {exc}")
                    time.sleep(2 ** attempt + 2)
            raise SystemExit(f"sendDocument failed after {retries} attempts: {last_error}")

        files = sorted(glob.glob("out/zip/*.zip"))
        if not files:
            print("No zip files found to send!")
            sys.exit(0)

        file_ids = []
        failed_files = []
        for i, path in enumerate(files, 1):
            size = os.path.getsize(path) if os.path.exists(path) else 0
            print(f"Uploading {path} ({size} bytes) to Dump Chat ({i}/{len(files)})...")
            if size == 0:
                print(f"Skipping {path}: file is empty, not failing build.")
                failed_files.append(path)
                continue
            payload = {"chat_id": dump_chat_id, "disable_notification": True}
            if dump_thread_id:
                payload["message_thread_id"] = dump_thread_id
            try:
                result = send_document(path, payload)
                file_ids.append(result["document"]["file_id"])
            except SystemExit as exc:
                print(f"Skipping {path} due to Telegram rejection, continuing: {exc}")
                failed_files.append(path)
                time.sleep(5)
                continue
            except Exception as exc:
                print(f"Failed to upload {path}: {exc}")
                failed_files.append(path)
            time.sleep(3)

        if failed_files:
            print(f"Warning: {len(failed_files)} file(s) skipped: {failed_files}")

        if not file_ids:
            print("Failed to upload any files to dump chat, but artifacts are safe on GitHub. Not failing build.")
            sys.exit(0)

        chunks = [file_ids[i:i + 10] for i in range(0, len(file_ids), 10)]
        first_message_id = None

        for idx, chunk in enumerate(chunks, 1):
            if not chunk:
                continue
            media = [{"type": "document", "media": fid} for fid in chunk]
            payload = {"chat_id": chat_id, "media": json.dumps(media)}
            print(f"Sending MediaGroup {idx}/{len(chunks)} to Main Chat...")
            result = api_post("sendMediaGroup", payload)
            if result and isinstance(result, list):
                first_message_id = first_message_id or result[0].get("message_id")
            time.sleep(2)

        if commit_text.strip():
            data = {
                "chat_id": chat_id,
                "text": commit_text,
                "parse_mode": "HTML",
                "link_preview_options": json.dumps({"is_disabled": True}),
            }
            if first_message_id:
                data["reply_parameters"] = json.dumps(
                    {"message_id": first_message_id, "allow_sending_without_reply": True}
                )
            print("Sending commit message to Main Chat...")
            api_post("sendMessage", data)
        PY

    - name: Notify Summary
      run: |
        {
          echo "## notify-telegram: done"
          echo ""
          echo "- Kernel: \`${{ needs.build.outputs.kernel-name }}\` | KSU: \`${{ needs.build.outputs.ksu-version }}\` | Build duration: \`${{ needs.build.outputs.duration }}\`"
          echo "- ZIPs downloaded: $(ls out/zip/*.zip 2>/dev/null | wc -l)"
          echo "- Artifact retention: GitHub auto-deletes artifacts after 90 days."
        } >> $GITHUB_STEP_SUMMARY

    - name: Notify Telegram on Failure
      if: failure()
      env:
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_DUMP_CHAT_ID: ${{ secrets.TG_DUMP_CHAT_ID }}
        TG_DUMP_THREAD_ID: ${{ secrets.TG_DUMP_THREAD_ID }}
      run: |
        COMMIT=$(git rev-parse --short HEAD)
        MSG="<b>Notify Failed</b> · Chimera-CI%0A"
        MSG+="<code>${GITHUB_REF_NAME}</code> · <code>${COMMIT}</code>%0A"
