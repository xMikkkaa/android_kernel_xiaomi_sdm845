name: Sync ReSukiSU

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        ref: master
        submodules: recursive
        fetch-depth: 0
        token: ${{ secrets.PAT_TOKEN }}

    - name: Sync ReSukiSU Commits
      run: |
        git config user.name "GitHub"
        git config user.email "noreply@github.com"
        
        cd KernelSU
        git fetch origin main
        
        CURRENT_COMMIT=$(git rev-parse HEAD)
        TARGET_COMMIT=$(git rev-parse FETCH_HEAD)
        
        if [ "$CURRENT_COMMIT" != "$TARGET_COMMIT" ]; then
          echo "Updates found: $CURRENT_COMMIT -> $TARGET_COMMIT"
          
          # Fetch commit sequence from oldest to newest
          COMMITS=$(git log --reverse --format="%H" ${CURRENT_COMMIT}..${TARGET_COMMIT})
          
          for COMMIT in $COMMITS; do
            echo "Syncing commit: $COMMIT"
            git checkout $COMMIT
            
            # Retrieve upstream commit message
            RAW_MSG=$(git log -1 --pretty=format:"%B" $COMMIT)
            
            # Retrieve upstream author
            AUTHOR_NAME=$(git log -1 --pretty=format:"%an" $COMMIT)
            AUTHOR_EMAIL=$(git log -1 --pretty=format:"%ae" $COMMIT)
            
            # Format cross-repo links
            COMMIT_MSG=$(echo "$RAW_MSG" | sed -E 's/#([0-9]+)/ReSukiSU\/ReSukiSU#\1/g')

            # Detect whether upstream commit would trigger manager build
            # Mirror of KernelSU/.github/workflows/build-manager.yml push.paths filter
            CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r --root -m $COMMIT || true)
            echo "Changed files in $COMMIT:"
            echo "$CHANGED_FILES"
            if echo "$CHANGED_FILES" | grep -Eq '^manager/|^kernel/|^userspace/|^scripts/ksubot\.py$|^\.github/workflows/(build-manager|build-lkm|ddk-lkm|ksud)\.yml$'; then
              SKIP_TAG=""
              echo "Manager-triggering change detected, CI will run."
            else
              SKIP_TAG=" [skip ci]"
              echo "No manager-triggering change, will add [skip ci]."
            fi
            
            cd ..
            git add KernelSU
            
            git commit --author="$AUTHOR_NAME <$AUTHOR_EMAIL>" -m "sync(kernelsu): update submodule to ${COMMIT:0:7}${SKIP_TAG}
            
            $COMMIT_MSG"
            
            # Push incrementally to trigger independent CI builds
            git push origin master
            
            # Delay to ensure GitHub Actions processes the push event
            sleep 5
            
            cd KernelSU
          done
        else
          echo "No updates found in KernelSU."
        fi
